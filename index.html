<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zelda: Ocarina of Time (Switch 2) Tracker</title>
  <meta name="theme-color" content="#0f1a14">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* "Hyrule dark" — forest green + stone, Triforce-gold accent */
      --bg:          #0f1a14;
      --surface:     #17261d;
      --surface-2:   #1f3327;
      --header:      #12211a;
      --border:      #2e4436;
      --text:        #ece6d3;
      --text-muted:  #a9b5a8;
      --gold:        #d9b44a;
      --done:        #7fd18b;
      --danger:      #f08a7a;
      --radius:      14px;
      --radius-sm:   10px;
    }
    html { overflow-x: clip; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: clip; padding-bottom: 2rem;
    }
    button { font: inherit; cursor: pointer; color: inherit; }
    input { font: inherit; }
    [hidden] { display: none !important; }

    /* ── Loading / sign-in overlay ────────────────────── */
    #overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.1rem; text-align: center; padding: 2rem 1rem;
    }
    #overlay .logo { width: 64px; height: 56px; }
    #overlay h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.5rem; color: var(--gold); letter-spacing: 0.02em; }
    #overlayMsg { color: var(--text-muted); font-size: 1rem; max-width: 22rem; }
    #overlayMsg.error { color: var(--danger); }
    .btn {
      display: none; align-items: center; gap: 0.6rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0.7rem 1.1rem; min-height: 48px;
      font-size: 0.95rem; font-weight: 600; color: var(--text);
    }
    .btn svg { width: 20px; height: 20px; }
    #whoami { display: none; color: var(--text); }
    #whoami strong { color: var(--gold); }

    /* ── Header ───────────────────────────────────────── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--header); border-bottom: 1px solid var(--border);
      box-shadow: 0 3px 14px rgba(0,0,0,0.4);
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 1rem 0.45rem; gap: 0.75rem;
    }
    .title-wrap { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
    .title-wrap svg { width: 26px; height: 23px; flex-shrink: 0; }
    .header-title {
      font-family: Georgia, "Times New Roman", serif; font-size: 0.98rem; font-weight: 700;
      color: var(--gold); line-height: 1.2;
    }
    @media (max-width: 559px) { .header-title { font-size: 0.85rem; } }
    .profile-btn {
      display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; max-width: 46%;
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 0.4rem 0.8rem; min-height: 40px; font-size: 0.85rem; font-weight: 600;
    }
    .profile-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Progress bars */
    .header-progress {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3rem 0.8rem;
      padding: 0.35rem 1rem 0.45rem; border-top: 1px solid var(--border);
    }
    @media (max-width: 559px) { .header-progress { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 860px) { .header-progress { grid-template-columns: repeat(6, 1fr); } }
    .progress-item { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
    .progress-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
    .progress-track { flex: 1; height: 7px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; min-width: 24px; }
    .progress-fill { height: 100%; width: 0%; border-radius: 4px; background: var(--gold); transition: width 0.35s ease; }
    .progress-fill.complete { background: var(--done); }
    .progress-count { font-size: 0.7rem; font-weight: 700; color: var(--text); white-space: nowrap; }

    /* Collapsible secondary rows */
    .collapsible {
      max-height: 12rem; overflow: hidden; opacity: 1;
      transition: max-height 0.25s ease, padding-top 0.25s ease, padding-bottom 0.25s ease, opacity 0.2s ease;
    }
    .site-header.compact .collapsible { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; border-top-width: 0; }

    /* Tabs */
    .tab-bar { display: flex; border-top: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    .tab-btn {
      flex: 1 0 auto; min-width: 52px; padding: 0.45rem 0.3rem 0.4rem; background: none; border: none;
      color: var(--text-muted); font-size: 0.7rem; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
      border-bottom: 3px solid transparent;
    }
    .tab-btn .tab-icon { font-size: 1.1rem; line-height: 1; }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* Tab sections */
    .tab-section { display: none; max-width: 1400px; margin: 0 auto; padding: 1rem; }
    .tab-section.active { display: block; }
    .placeholder {
      background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 1.5rem 1rem; text-align: center; color: var(--text-muted); line-height: 1.5;
    }
    .placeholder strong { color: var(--text); }

    /* Sections + card grid */
    .group { margin-bottom: 1.5rem; }
    .group-header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 0.3rem 0.1rem 0.5rem; border-bottom: 2px solid var(--border); margin-bottom: 0.7rem;
    }
    .group-name { font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; font-weight: 700; }
    .group-badge {
      font-size: 0.78rem; font-weight: 700; padding: 0.2rem 0.65rem; border-radius: 20px;
      background: var(--surface-2); color: var(--text-muted); white-space: nowrap;
    }
    .group-badge.complete { background: #1d4a2a; color: var(--done); }
    .group-note { font-size: 0.8rem; color: var(--text-muted); margin: -0.3rem 0 0.7rem; }
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
    @media (min-width: 560px)  { .card-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 860px)  { .card-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1160px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }

    /* Item card */
    .item-card {
      background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
      padding: 0.85rem; display: flex; flex-direction: column; gap: 0.65rem;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .item-card.is-done { border-color: #3f7a4c; opacity: 0.7; }
    .item-card.readonly { border-style: dashed; }
    .card-top { display: flex; gap: 0.7rem; align-items: center; }
    .card-check { flex-shrink: 0; width: 52px; height: 52px; padding: 0; }
    .card-check input { width: 24px; height: 24px; }
    .card-icon {
      width: 48px; height: 48px; flex-shrink: 0; border-radius: var(--radius-sm); background: var(--surface-2);
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-weight: 700; font-size: 1rem; line-height: 1.25; }
    .card-num { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-right: 0.3em; }
    .card-meta { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.2rem; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }
    .tag { font-size: 0.72rem; font-weight: 600; padding: 0.12rem 0.5rem; border-radius: 20px; background: var(--surface-2); color: var(--text); }
    .wip-note { font-size: 0.82rem; color: var(--gold); }

    /* Check pill */
    .check-pill {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      min-height: 48px; padding: 0.5rem; border-radius: var(--radius-sm);
      border: 2px solid var(--border); background: var(--surface-2);
      font-size: 0.9rem; font-weight: 700; color: var(--text-muted);
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .check-pill input { width: 20px; height: 20px; accent-color: var(--done); cursor: pointer; margin: 0; }
    .check-pill.is-checked { border-color: var(--done); background: #1d4a2a; color: var(--done); }

    /* Items & Songs quick lists */
    .quick-grid { display: grid; grid-template-columns: 1fr; gap: 0.45rem; }
    @media (min-width: 560px)  { .quick-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 860px)  { .quick-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1160px) { .quick-grid { grid-template-columns: repeat(4, 1fr); } }
    .quick-row { justify-content: flex-start; min-height: 46px; padding: 0.45rem 0.7rem; font-weight: 600; color: var(--text); }
    .quick-row .q-order { font-size: 0.72rem; color: var(--text-muted); min-width: 1.4rem; }
    .quick-row .q-name { flex: 1; }
    .quick-row.derived { cursor: default; border-style: dashed; }
    .quick-row.derived .q-auto { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }

    /* Scarecrow recorder */
    .scarecrow { margin-top: 0.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem; }
    .scarecrow-title { font-weight: 700; margin-bottom: 0.2rem; }
    .scarecrow-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.7rem; }
    .sc-slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.3rem; margin-bottom: 0.75rem; max-width: 420px; }
    .sc-slot { aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; }
    .sc-pad { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
    .n64 {
      width: 44px; height: 44px; border-radius: 50%; border: none; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; line-height: 1;
    }
    .n64.a { background: #3b6fd8; color: #fff; }
    .n64.c { background: #e8c234; color: #2a2205; }
    .sc-slot .n64 { width: 100%; height: 100%; font-size: 0.85rem; }
    .sc-pad .act-btn { min-height: 44px; }

    /* Skulltula reward badges */
    .rewards { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.3rem; }
    .reward {
      display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 600;
      padding: 0.35rem 0.7rem; border-radius: 20px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-muted);
    }
    .reward b { color: var(--text); }
    .reward.earned { border-color: var(--gold); background: #3a3115; color: var(--text); }
    .reward.earned b { color: var(--gold); }

    /* ── Sheet (modal) ────────────────────────────────── */
    #backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 50%; top: 50%; z-index: 201;
      width: min(94vw, 480px); max-height: 88vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.1rem 1.1rem 1.3rem;
      transform: translate(-50%, -50%) scale(0.95); opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .sheet.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; }
    .sheet-title { font-family: Georgia, "Times New Roman", serif; font-size: 1.2rem; color: var(--gold); }
    .close-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--surface-2); font-size: 1rem; font-weight: 700;
    }
    .sheet-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-muted); margin: 1rem 0 0.45rem;
    }

    /* Profile rows */
    .prof-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .prof-row {
      display: flex; align-items: center; gap: 0.4rem;
      background: var(--surface-2); border: 2px solid transparent; border-radius: var(--radius-sm); padding: 0.35rem;
    }
    .prof-row.current { border-color: var(--gold); }
    .prof-pick {
      flex: 1; min-width: 0; text-align: left; background: none; border: none;
      padding: 0.45rem 0.5rem; min-height: 48px;
    }
    .prof-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prof-row.current .prof-name::before { content: "▶ "; color: var(--gold); }
    .prof-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem; }
    .icon-btn {
      flex-shrink: 0; min-width: 44px; min-height: 44px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border); font-size: 0.85rem; padding: 0 0.6rem;
    }
    .icon-btn.danger { color: var(--danger); }
    .icon-btn.confirm { background: var(--danger); color: #1a0d0a; font-weight: 700; border-color: var(--danger); }
    .prof-form { display: flex; flex-direction: column; gap: 0.55rem; background: var(--surface-2); border-radius: var(--radius-sm); padding: 0.75rem; }
    .prof-form label { font-size: 0.8rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 0.25rem; }
    .field {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      padding: 0.55rem 0.65rem; min-height: 44px; outline: none; color-scheme: dark;
    }
    .field:focus { border-color: var(--gold); }
    .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .act-btn {
      min-height: 44px; padding: 0 1rem; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border); font-weight: 600;
    }
    .act-btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1408; }
    .new-btn { width: 100%; margin-top: 0.6rem; }
    .trash-toggle { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; padding: 0.6rem 0; min-height: 44px; }
    .sheet-foot { margin-top: 1.1rem; padding-top: 0.8rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .sheet-foot strong { color: var(--gold); }

    /* Toast */
    #toast {
      position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); z-index: 600;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.7rem 1rem; max-width: 92vw; font-size: 0.9rem; box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    #toast.error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<div id="overlay">
  <svg class="logo" viewBox="0 0 64 56" aria-hidden="true">
    <path fill="#d9b44a" d="M32 0 48 28H16zM16 28 32 56H0zM48 28 64 56H32z"/>
  </svg>
  <h1>Zelda: Ocarina of Time (Switch 2) Tracker</h1>
  <div id="overlayMsg">Connecting…</div>
  <div id="whoami"></div>
  <button class="btn" id="signInBtn">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign in with Google
  </button>
  <button class="btn" id="retryBtn">Retry</button>
  <button class="btn" id="signOutBtn">Sign out</button>
</div>

<header class="site-header" id="header" hidden>
  <div class="header-top">
    <div class="title-wrap">
      <svg viewBox="0 0 64 56" aria-hidden="true"><path fill="#d9b44a" d="M32 0 48 28H16zM16 28 32 56H0zM48 28 64 56H32z"/></svg>
      <div class="header-title">Zelda: Ocarina of Time (Switch 2) Tracker</div>
    </div>
    <button class="profile-btn" id="profileBtn" aria-label="Profiles">👤 <span id="profileName">No profile</span> ▾</button>
  </div>
  <div class="header-progress collapsible" id="headerProgress"></div>
  <nav class="tab-bar" id="tabBar"></nav>
</header>

<main id="main" hidden></main>

<div id="backdrop"></div>
<div class="sheet" id="profileSheet" role="dialog" aria-modal="true" aria-label="Profiles">
  <div class="sheet-head">
    <div class="sheet-title">Profiles</div>
    <button class="close-btn" data-close aria-label="Close">✕</button>
  </div>
  <div id="profileBody"></div>
  <div class="sheet-foot">
    <span id="sheetWho"></span>
    <button class="act-btn" id="sheetSignOut">Sign out</button>
  </div>
</div>

<div id="toast" hidden></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// localStorage can throw (private mode, blocked storage): per-device settings just fall back.
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

if (!_firebaseConfig.apiKey) {
  say('Firebase config not set yet.', true);
  throw new Error('Firebase config missing');

const _app  = initializeApp(_firebaseConfig);
const _auth = getAuth(_app);
const _db   = getDatabase(_app);

// ============================================================================
// Catalog layout — categories, and which tab shows them
// ============================================================================
const CATS = {

  heart:     { label: 'Pieces of Heart',   icon: '❤️' },

};
const TABS = [
  { id: 'progress',   icon: '📜', label: 'Progress',   bar: 'Story',      cats: ['milestone'] },
  { id: 'hearts',     icon: '❤️', label: 'Hearts',     bar: 'Hearts',     cats: ['heart'] },
  { id: 'skulltulas', icon: '🕷️', label: 'Skulltulas', bar: 'Skulltulas', cats: ['skulltula'] },
  { id: 'gear',       icon: '🎭', label: 'Gear',       bar: 'Gear',       cats: ['mask', 'upgrade', 'fairy', 'bottle', 'biggoron'] },
  { id: 'world',      icon: '🌱', label: 'World',      bar: 'World',      cats: ['soil', 'bigpoe'] },
  { id: 'hall',       icon: '🏛️', label: 'Hall',       stub: 'Boss best times and the 🚧 enemy statues arrive in Stage 3.' },
  { id: 'notes',      icon: '📝', label: 'Notes',      stub: 'Per-profile notes arrive in Stage 3.' },
];

let DATA = null;          // data.json
let BY_ID = {};           // id → entry, item or song
let me = null;            // signed-in user's friendly name
let profiles = {};        // /profiles
let pid = null;           // selected profile id (per device)
let progress = {};        // /progress/{pid}
let scarecrow = [];       // /scarecrow/{pid}: note ids, in order
let unsubs = [];          // listeners for the selected profile
let currentTab = TABS.some((t) => t.id === lsGet('oot.tab')) ? lsGet('oot.tab') : 'progress';

// ============================================================================
// Auth
// ============================================================================
const _provider = new GoogleAuthProvider();
_provider.setCustomParameters({ prompt: 'select_account' });
let _accessDenied = false;

$('signInBtn').addEventListener('click', () => {
  say('Signing in…');
  show('signInBtn', false);
  signInWithPopup(_auth, _provider).catch((err) => {
    console.error('sign-in failed', err);
    say('Sign-in failed. Please try again.', true);
    show('signInBtn', true);
  });
});
$('retryBtn').addEventListener('click', () => { if (_auth.currentUser) connect(_auth.currentUser); });
$('signOutBtn').addEventListener('click', () => signOut(_auth));
$('sheetSignOut').addEventListener('click', () => signOut(_auth).then(() => location.reload()));

onAuthStateChanged(_auth, (user) => {
  show('retryBtn', false);
  show('signOutBtn', false);
  $('whoami').style.display = 'none';
  if (!user) {
    say(_accessDenied
      ? "That account can't access this tracker. Sign in with an authorized Google account."
      : 'Sign in to load your tracker', _accessDenied);
    show('signInBtn', true);
    return;
  }
  connect(user);
});

// Probe a read so the database rules (not the client) decide access.
// Times out instead of hanging forever if Firebase never answers.
function connect(user) {
  say('Loading…');
  show('signInBtn', false);
  show('retryBtn', false);
  const timeout = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('timeout')), DB_TIMEOUT_MS));
  Promise.race([get(ref(_db, 'profiles')), timeout]).then(() => {
    _accessDenied = false;
    me = ALLOWED[user.email] || user.email;
    return fetch('data.json').then((r) => r.json())
      .then((data) => { DATA = data; startApp(); })
      .catch((e) => { console.error('data.json failed', e); say("Connected, but the catalog (data.json) didn't load.", true); show('retryBtn', true); });
  }).catch((err) => {
    if (err.message === 'timeout') {
      say("Couldn't reach the database. Check your connection and retry.", true);
      show('retryBtn', true);
      show('signOutBtn', true);
      return;
    }
    console.warn('read denied', err);
    _accessDenied = true;
    signOut(_auth);
  });
}

// ============================================================================
// App start
// ============================================================================
let started = false;
function startApp() {
  if (started) return;
  started = true;
  $('overlay').hidden = true;
  $('overlay').style.display = 'none';
  $('header').hidden = false;
  $('main').hidden = false;
  $('sheetWho').innerHTML = `Signed in as <strong>${esc(me)}</strong>`;
  for (const x of [...DATA.entries, ...DATA.items, ...DATA.songs]) BY_ID[x.id] = x;
  buildTabs();
  onValue(ref(_db, 'profiles'), (snap) => {
    profiles = snap.val() || {};
    ensureSelection();
    renderProfileSheet();
    renderProfileBtn();
  }, (err) => toast('Lost access to profiles: ' + err.message, true));
}

function buildTabs() {
  $('tabBar').innerHTML = TABS.map((t) =>
    `<button class="tab-btn" data-tab="${t.id}"><span class="tab-icon">${t.icon}</span>${t.label}</button>`).join('');
  $('main').innerHTML = TABS.map((t) =>
    `<section class="tab-section" id="tab-${t.id}">${t.stub ? `<div class="placeholder">${t.stub}</div>` : ''}</section>`).join('');
  $('tabBar').addEventListener('click', (e) => {
    const b = e.target.closest('.tab-btn');
    if (b) switchTab(b.dataset.tab);
  });
  switchTab(currentTab);
}

function switchTab(id) {
  currentTab = id;
  lsSet('oot.tab', id);
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-section').forEach((s) => s.classList.toggle('active', s.id === 'tab-' + id));
  render();
}

// ============================================================================
// Progress state
// ============================================================================
const entriesIn = (cats) => DATA.entries.filter((e) => cats.includes(e.category));
const gsCount = () => entriesIn(['skulltula']).filter((e) => progress[e.id]).length;
// Items with derivedFrom (Master Sword, fairy spells, wallets…) mirror another check and can't be set by hand.
function isDone(id) {
  const it = BY_ID[id];
  return it?.derivedFrom ? met(it.derivedFrom) : !!progress[id];
}
// A requirement is an id, "gs:N" (N Skulltulas), "bottle" (any checked bottle),
// {any: [alt…]}, or a list that must all be met (an alt may itself be a list).
function met(req) {
  if (Array.isArray(req)) return req.every(met);
  if (typeof req === 'object') return req.any.some(met);
  if (req.startsWith('gs:')) return gsCount() >= Number(req.slice(3));
  if (req === 'bottle') return entriesIn(['bottle']).some((e) => progress[e.id]);
  return isDone(req);
}
function reqLabel(req) {
  if (Array.isArray(req)) return req.map(reqLabel).join(' + ');
  if (typeof req === 'object') return req.any.map(reqLabel).join(' or ');
  if (req.startsWith('gs:')) return `${req.slice(3)} Gold Skulltulas`;
  if (req === 'bottle') return 'a bottle';
  return BY_ID[req]?.name || req;
}

function toggle(id, on) {
  set(ref(_db, `progress/${pid}/${id}`), on ? { at: Date.now(), by: me } : null).catch(fail('save that'));
}

function renderProgressBars() {
  const rows = TABS.filter((t) => t.cats).map((t) => {
    const list = entriesIn(t.cats).filter((e) => !e.readOnly);
    return { label: t.bar, done: list.filter((e) => isDone(e.id)).length, total: list.length };
  });
  rows.push({ label: 'Total', done: rows.reduce((a, r) => a + r.done, 0), total: rows.reduce((a, r) => a + r.total, 0) });
  $('headerProgress').innerHTML = rows.map((r) => `
    <div class="progress-item" title="${r.label}: ${r.done} of ${r.total}">
      <span class="progress-label">${r.label}</span>
      <div class="progress-track"><div class="progress-fill${r.done === r.total ? ' complete' : ''}" style="width:${r.total ? (100 * r.done / r.total) : 0}%"></div></div>
      <span class="progress-count">${r.done}/${r.total}</span>
    </div>`).join('');
}

function render() {
  if (!DATA) return;
  renderProgressBars();
  const t = TABS.find((x) => x.id === currentTab);
  if (t.stub) return;
  $('tab-' + t.id).innerHTML = pid
    ? renderTab(t)
    : `<div class="placeholder">No profile yet. <strong>Create one</strong> from the 👤 button to start tracking.</div>`;
}

// One renderer for every catalog tab: sections of cards, grouped by area or by category.
function renderTab(t) {
  if (t.id === 'progress') {
    return group('📜 Story', entriesIn(['milestone']))
      + quickList('Items & Equipment', DATA.items)
      + quickList('Songs', DATA.songs)
      + scarecrowHTML();
  }
  let h = t.id === 'skulltulas' ? rewardsHTML() : '';
  if (t.id === 'hearts' || t.id === 'skulltulas') {
    for (const a of DATA.areas) {
      const list = entriesIn(t.cats).filter((e) => e.areaId === a.id);
      if (list.length) h += group(esc(a.name), list);
    }
  } else {
    for (const c of t.cats) h += group(`${CATS[c].icon} ${CATS[c].label}`, entriesIn([c]));
  }
  return h;
}

function badge(done, total) {
  return `<span class="group-badge${total && done === total ? ' complete' : ''}">${done}/${total}</span>`;
}

function group(title, list) {
  const counted = list.filter((e) => !e.readOnly);
  return `<div class="group">
    <div class="group-header"><span class="group-name">${title}</span>${badge(counted.filter((e) => isDone(e.id)).length, counted.length)}</div>
    <div class="card-grid">${list.map(card).join('')}</div>
  </div>`;
}

const AGE  = { young: 'Young Link', adult: 'Adult Link' };
const TIME = { night: '🌙 Night', day: '☀️ Day' };
function card(e) {
  const done = isDone(e.id);
  const tags = [AGE[e.age], TIME[e.time]].filter(Boolean).map((x) => `<span class="tag">${x}</span>`).join('');
  const num = e.category === 'milestone' ? '' : `<span class="card-num">#${e.num}</span>`;
  const check = e.readOnly ? ''
    : `<label class="check-pill card-check${done ? ' is-checked' : ''}" aria-label="${e.category === 'milestone' ? 'Done' : 'Got it'}"><input type="checkbox" data-check="${e.id}"${done ? ' checked' : ''}></label>`;
  return `<div class="item-card${done ? ' is-done' : ''}${e.readOnly ? ' readonly' : ''}" data-id="${e.id}">
    <div class="card-top">
      <div class="card-icon">${e.readOnly ? '🚧' : CATS[e.category].icon}</div>
      <div class="card-info">
        <div class="card-name">${num}${esc(e.name)}</div>
        ${e.area ? `<div class="card-meta">📍 ${esc(e.area)}</div>` : ''}
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      </div>
      ${check}
    </div>
    ${e.readOnly ? '<div class="wip-note">🚧 Under construction: how to get it is unknown until the remake launches.</div>' : ''}
  </div>`;
}

// Items & Songs: filter inputs only (they feed "Gettable now"), never counted toward progress.
function quickList(title, list) {
  const rows = [...list].sort((a, b) => a.order - b.order).map((i) => {
    const d = isDone(i.id);
    const name = `<span class="q-order">${i.order}</span><span class="q-name">${esc(i.name)}`;
    return i.derivedFrom
      ? `<div class="check-pill quick-row derived${d ? ' is-checked' : ''}">${name}<br><span class="q-auto">${d ? '✓ ' : ''}auto, from ${esc(reqLabel(i.derivedFrom))}</span></span></div>`
      : `<label class="check-pill quick-row${d ? ' is-checked' : ''}">${name}</span><input type="checkbox" data-check="${i.id}"${d ? ' checked' : ''}></label>`;
  });
  return `<div class="group">
    <div class="group-header"><span class="group-name">${title}</span>${badge(list.filter((i) => isDone(i.id)).length, list.length)}</div>
    <div class="group-note">Check these off as you get them. The filters use them; they don't count toward completion.</div>
    <div class="quick-grid">${rows.join('')}</div>
  </div>`;
}

// Scarecrow's Song: 8 notes per profile, stored by ocarina note, shown as N64 buttons.
const NOTES = {
  D4: { btn: 'A', cls: 'a', name: 'A' },
  F4: { btn: '▼', cls: 'c', name: 'C-Down' },
  A4: { btn: '▶', cls: 'c', name: 'C-Right' },
  B4: { btn: '◀', cls: 'c', name: 'C-Left' },
  D5: { btn: '▲', cls: 'c', name: 'C-Up' },
};
let confirmClear = false, clearTimer = null;
function scarecrowHTML() {
  const max = DATA.songs.find((s) => s.recordNotes)?.recordNotes || 8;
  const notes = scarecrow.slice(0, max);
  const slots = Array.from({ length: max }, (_, i) => notes[i]
    ? `<div class="sc-slot"><span class="n64 ${NOTES[notes[i]].cls}" title="${NOTES[notes[i]].name}">${NOTES[notes[i]].btn}</span></div>`
    : '<div class="sc-slot"></div>').join('');
  const full = notes.length >= max;
  const pad = Object.entries(NOTES).map(([k, n]) =>
    `<button class="n64 ${n.cls}" data-note="${k}" aria-label="${n.name}"${full ? ' disabled style="opacity:.35"' : ''}>${n.btn}</button>`).join('');
  return `<div class="scarecrow">
    <div class="scarecrow-title">🎃 Scarecrow's Song: your ${max} notes</div>
    <div class="scarecrow-sub">Record the song you taught Pierre as young Link, so you can play it back as an adult. N64 buttons until the remake's controls are known.</div>
    <div class="sc-slots" id="scSlots">${slots}</div>
    <div class="sc-pad">${pad}
      <button class="act-btn" data-sc="back"${notes.length ? '' : ' disabled'} aria-label="Delete last note">⌫</button>
      <button class="act-btn${confirmClear ? ' primary' : ''}" data-sc="clear"${notes.length ? '' : ' disabled'}>${confirmClear ? 'Tap to clear' : 'Clear'}</button>
    </div>
  </div>`;
}
function saveScarecrow(notes) {
  set(ref(_db, `scarecrow/${pid}`), notes.length ? notes : null).catch(fail('save the notes'));
}

function rewardsHTML() {
  const n = gsCount();
  const notes = DATA.skulltulaRewards.filter((r) => r.switch2Note).map((r) => `⚠️ ${r.tokens}: ${esc(r.switch2Note)}`);
  return `<div class="group-header"><span class="group-name">🏆 Skulltula rewards</span>${badge(n, 100)}</div>
    <div class="rewards">${DATA.skulltulaRewards.map((r) => `<span class="reward${n >= r.tokens ? ' earned' : ''}">
      <b>${n >= r.tokens ? '✓ ' : ''}${r.tokens}</b> ${esc(r.reward)}${r.switch2Note ? ' ⚠️' : ''}</span>`).join('')}</div>
    ${notes.length ? `<div class="group-note">${notes.join('<br>')}</div>` : ''}`;
}

$('main').addEventListener('change', (e) => {
  const id = e.target.dataset.check;
  if (id && pid) toggle(id, e.target.checked);
});
$('main').addEventListener('click', (e) => {
  const note = e.target.closest('[data-note]')?.dataset.note;
  const sc = e.target.closest('[data-sc]')?.dataset.sc;
  if (!pid || (!note && !sc)) return;
  if (note) saveScarecrow([...scarecrow, note]);
  if (sc === 'back') saveScarecrow(scarecrow.slice(0, -1));
  if (sc === 'clear') {
    if (!confirmClear) {
      confirmClear = true;
      clearTimeout(clearTimer);
      clearTimer = setTimeout(() => { confirmClear = false; render(); }, 4000);
      render();
    } else {
      confirmClear = false;
      saveScarecrow([]);
    }
  }
});

// ============================================================================
// Profiles — shared between both accounts; the selection is per device
// ============================================================================
const activeProfiles = () => Object.entries(profiles).filter(([, p]) => !p.deletedAt)
  .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0)).map(([id, p]) => ({ id, ...p }));
const trashedProfiles = () => Object.entries(profiles).filter(([, p]) => p.deletedAt)
  .sort((a, b) => b[1].deletedAt - a[1].deletedAt).map(([id, p]) => ({ id, ...p }));
const usable = (id) => id && profiles[id] && !profiles[id].deletedAt;

function ensureSelection() {
  if (usable(pid)) return;
  const saved = lsGet('oot.profile');
  selectProfile(usable(saved) ? saved : (activeProfiles()[0]?.id || null));
}

function selectProfile(id) {
  unsubs.forEach((u) => u());
  unsubs = [];
  pid = id;
  progress = {};
  scarecrow = [];
  if (id) {
    lsSet('oot.profile', id);
    const lost = (err) => toast('Lost access to this profile: ' + err.message, true);
    unsubs.push(onValue(ref(_db, `progress/${id}`), (snap) => { progress = snap.val() || {}; render(); }, lost));
    unsubs.push(onValue(ref(_db, `scarecrow/${id}`), (snap) => { scarecrow = snap.val() || []; render(); }, lost));
  }
  renderProfileBtn();
  renderProfileSheet();
  render();
}

function renderProfileBtn() {
  $('profileName').textContent = usable(pid) ? profiles[pid].name : 'No profile';
}

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = (s) => s ? new Date(s + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : 'no start date';

// Sheet UI state
let editing = null;          // pid being renamed
let creating = false;
let showTrash = false;
let confirmPurge = null;     // pid armed for permanent delete
let confirmTimer = null;

function profileForm(kind, p = {}) {
  return `<div class="prof-form" data-form="${kind}">
    <label>Name<input class="field" id="pf-name" maxlength="60" value="${esc(p.name || '')}" placeholder="e.g. Aaron's first run"></label>
    <label>Playthrough start date<input class="field" id="pf-date" type="date" value="${esc(p.startDate || today())}"></label>
    <div class="form-actions">
      <button class="act-btn" data-act="cancel">Cancel</button>
      <button class="act-btn primary" data-act="${kind === 'new' ? 'create' : 'save'}">${kind === 'new' ? 'Create' : 'Save'}</button>
    </div>
  </div>`;
}

function renderProfileSheet() {
  if (!DATA) return;
  const act = activeProfiles(), trash = trashedProfiles();
  let h = '<div class="prof-list">';
  if (!act.length && !creating) h += '<div class="placeholder">No profiles yet. Create one for this playthrough.</div>';
  for (const p of act) {
    if (editing === p.id) { h += profileForm('edit', p); continue; }
    h += `<div class="prof-row${p.id === pid ? ' current' : ''}" data-pid="${p.id}">
      <button class="prof-pick" data-act="pick"><div class="prof-name">${esc(p.name)}</div><div class="prof-sub">Started ${fmtDate(p.startDate)}</div></button>
      <button class="icon-btn" data-act="edit" aria-label="Rename">✏️</button>
      <button class="icon-btn danger" data-act="trash" aria-label="Move to trash">🗑</button>
    </div>`;
  }
  h += '</div>';
  h += creating ? `<div style="margin-top:0.6rem">${profileForm('new')}</div>`
                : '<button class="act-btn new-btn" data-act="new">＋ New profile</button>';
  if (trash.length) {
    h += `<button class="trash-toggle" data-act="toggle-trash">${showTrash ? '▾' : '▸'} Trash (${trash.length})</button>`;
    if (showTrash) {
      h += '<div class="prof-list">';
      for (const p of trash) {
        h += `<div class="prof-row" data-pid="${p.id}">
          <div class="prof-pick"><div class="prof-name">${esc(p.name)}</div><div class="prof-sub">Trashed ${new Date(p.deletedAt).toLocaleDateString()}</div></div>
          <button class="icon-btn" data-act="restore">Restore</button>
          <button class="icon-btn ${confirmPurge === p.id ? 'confirm' : 'danger'}" data-act="purge">${confirmPurge === p.id ? 'Tap to confirm' : 'Delete forever'}</button>
        </div>`;
      }
      h += '</div>';
    }
  }
  $('profileBody').innerHTML = h;
  const nameField = $('pf-name');
  if (nameField && !nameField.dataset.focused) { nameField.dataset.focused = '1'; nameField.focus(); }
}

const fail = (what) => (err) => { console.error(what, err); toast(`Couldn't ${what}: ${err.message}`, true); };

$('profileBody').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.closest('[data-pid]')?.dataset.pid;
  const act = b.dataset.act;
  if (act === 'pick') { selectProfile(id); closeSheet(); return; }
  if (act === 'edit') { editing = id; creating = false; }
  if (act === 'new') { creating = true; editing = null; }
  if (act === 'cancel') { editing = null; creating = false; }
  if (act === 'create' || act === 'save') { submitProfileForm(act); return; }
  if (act === 'trash') {
    update(ref(_db, `profiles/${id}`), { deletedAt: Date.now() })
      .then(() => toast(`"${profiles[id]?.name}" moved to Trash.`)).catch(fail('move it to Trash'));
  }
  if (act === 'toggle-trash') showTrash = !showTrash;
  if (act === 'restore') update(ref(_db, `profiles/${id}`), { deletedAt: null }).catch(fail('restore it'));
  if (act === 'purge') {
    if (confirmPurge !== id) {
      confirmPurge = id;
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(() => { confirmPurge = null; renderProfileSheet(); }, 4000);
    } else {
      confirmPurge = null;
      // One atomic multi-path write; the rules only allow removing a profile that's already trashed.
      const gone = {};
      for (const root of ['profiles', 'progress', 'bossTimes', 'celebrated', 'notes', 'scarecrow']) gone[`${root}/${id}`] = null;
      update(ref(_db), gone).then(() => toast('Deleted forever.')).catch(fail('delete it'));
    }
  }
  renderProfileSheet();
});

$('profileBody').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'pf-name') submitProfileForm(creating ? 'create' : 'save');
});

function submitProfileForm(act) {
  const name = $('pf-name').value.trim();
  const startDate = $('pf-date').value || null;
  if (!name) { $('pf-name').focus(); toast('Give the profile a name.', true); return; }
  if (act === 'create') {
    const r = push(ref(_db, 'profiles'));
    set(r, { name, startDate, createdBy: me, createdAt: Date.now() })
      .then(() => { selectProfile(r.key); }).catch(fail('create the profile'));
    creating = false;
  } else {
    update(ref(_db, `profiles/${editing}`), { name, startDate }).catch(fail('save the profile'));
    editing = null;
  }
  renderProfileSheet();
}

// ============================================================================
// Sheet open/close — phone Back closes it
// ============================================================================
let openSheetEl = null;
function openSheet(el) {
  openSheetEl = el;
  el.classList.add('open');
  $('backdrop').classList.add('open');
  history.pushState({ sheet: el.id }, '');
}
function hideSheet() {
  if (!openSheetEl) return;
  openSheetEl.classList.remove('open');
  $('backdrop').classList.remove('open');
  openSheetEl = null;
  editing = null; creating = false; confirmPurge = null;
}
function closeSheet() { if (openSheetEl) history.back(); }
window.addEventListener('popstate', hideSheet);
$('backdrop').addEventListener('click', closeSheet);
document.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
$('profileBtn').addEventListener('click', () => {
  creating = !activeProfiles().length;
  renderProfileSheet();
  openSheet($('profileSheet'));
});

// ============================================================================
// Toast
// ============================================================================
let toastTimer = null;
function toast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 6000 : 2800);
}

// Collapse secondary header rows when scrolling down, expand when scrolling up
(function () {
  const header = $('header');
  const THRESHOLD = 15;
  let lastToggleY = window.scrollY;
  // The collapse changes the page height and scroll anchoring then shifts scrollY by that much,
  // which would read as a scroll the other way. Ignore scrolls until the transition settles.
  let settling = false;
  const toggle = (compact) => {
    header.classList.toggle('compact', compact);
    settling = true;
    setTimeout(() => { settling = false; lastToggleY = window.scrollY; }, 350);
  };
  window.addEventListener('scroll', () => {
    if (settling) return;
    const y = window.scrollY;
    const compact = header.classList.contains('compact');
    if (!compact && y > lastToggleY + THRESHOLD && y > 40) toggle(true);
    else if (compact && y < lastToggleY - THRESHOLD) toggle(false);
    // Keep following the furthest point in the current direction (as the old re-toggle did).
    else if (compact ? y > lastToggleY : y < lastToggleY) lastToggleY = y;
  }, { passive: true });
})();
</script>
</body>
